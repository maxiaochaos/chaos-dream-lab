<svg width="216" height="110" viewBox="0 0 216 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="216" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33251f"/>
      <stop offset="0.22" stop-color="#17110f"/>
      <stop offset="0.65" stop-color="#0a0807"/>
      <stop offset="1" stop-color="#030302"/>
    </linearGradient>
    <linearGradient id="redplate" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f211b"/>
      <stop offset="0.28" stop-color="#5c0c08"/>
      <stop offset="0.66" stop-color="#2a0504"/>
      <stop offset="1" stop-color="#100202"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(108 72) rotate(90) scale(25)">
      <stop stop-color="#fff5bc"/>
      <stop offset="0.18" stop-color="#ff8b4e"/>
      <stop offset="0.45" stop-color="#f02f2a"/>
      <stop offset="1" stop-color="#5b0707" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rustLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(11 18) rotate(17) scale(78 38)">
      <stop stop-color="#8a4a27" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1b0805" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rustRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(196 96) rotate(-20) scale(72 30)">
      <stop stop-color="#7a351f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1b0805" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-10%" y="-15%" width="120%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.58" numOctaves="5" seed="76"/>
      <feColorMatrix type="matrix" values="0.45 0 0 0 0.08 0 0.33 0 0 0.055 0 0 0.24 0 0.04 0 0 0 0.55 0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08 0.25 0.55"/>
      </feComponentTransfer>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

